<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;background:#efeae2;}
        #login {flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#075e54;color:white;}
        #chat {flex:1;display:flex;flex-direction:column;}
        #header {background:#075e54;color:white;padding:15px;text-align:center;font-weight:bold;}
        #messages {flex:1;overflow-y:auto;padding:10px;background:#efeae2;}
        .message {margin:10px 0;display:flex;}
        .message.mine {flex-direction:row-reverse;}
        .bubble {max-width:70%;padding:8px 12px;border-radius:18px;word-wrap:break-word;}
        .mine .bubble {background:#dcf8c6;margin-left:20px;}
        .other .bubble {background:white;margin-right:20px;box-shadow:0 1px 2px rgba(0,0,0,0.1);}
        .status {text-align:center;color:#667781;font-size:12px;margin:10px 0;}
        #input-area {display:flex;padding:10px;background:#f0f0f0;}
        #message {flex:1;padding:12px;border:none;border-radius:25px;background:white;margin-right:10px;}
        button {background:#075e54;color:white;border:none;padding:12px 20px;border-radius:25px;cursor:pointer;}
        #users {background:#e1f5fe;padding:10px;font-size:12px;}
    </style>
</head>
<body>
    <div id="login">
        <h2>💬 WhatsApp Clone</h2>
        <input id="username" placeholder="Enter your name" style="width:250px;padding:12px;border-radius:25px;border:none;margin:20px;">
        <button onclick="joinChat()">Start Messaging</button>
    </div>
    <div id="chat" style="display:none;">
        <div id="header">WhatsApp Clone - Live Chat</div>
        <div id="users">Online: Nobody</div>
        <div id="messages"></div>
        <div id="input-area">
            <input id="message" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        const socket = io();
        let username;
        function joinChat() {
            username = document.getElementById('username').value || 'Anonymous';
            socket.emit('join', {username});
            document.getElementById('login').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
        }
        function sendMessage() {
            const input = document.getElementById('message');
            const text = input.value.trim();
            if (text) {
                socket.emit('message', {text});
                input.value = '';
            }
        }
        function addMessage(msg) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            if (msg.type === 'status') {
                div.className = 'status';
                div.textContent = msg.text;
            } else {
                div.className = `message ${msg.user === username ? 'mine' : 'other'}`;
                div.innerHTML = `<div class="bubble">${msg.text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m] || m)}</div>`;
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        socket.on('message', addMessage);
        socket.on('status', data => addMessage({text: data.msg, type: 'status'}));
        socket.on('users', userlist => {
            document.getElementById('users').innerHTML = `Online: ${userlist.join(', ') || 'Nobody'}`;
        });
    </script>
</body>
</html>
